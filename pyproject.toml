[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "restream-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psutil",
    "pydantic>=2.10,<3",
    "streamget==4.0.10",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pyinstaller",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not live_network'"
markers = [
    "live_network: opt-in test that makes one request to the configured live resolver",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.setuptools.packages.find]
where = ["src"]
